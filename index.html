#homel{background:var(--wp) center/cover!important}
#lock,#pass{background:radial-gradient(ellipse at 30% 0%,#36363e,#15151a 38%,#0a0a0d 80%)!important}
.lki{position:absolute;top:34px;left:50%;width:15px;height:15px;margin-left:-7.500px}
#lock .ld{top:60px;font-size:15px;font-weight:600;color:#fffe}
#lock .lt{top:80px;font-size:64px;font-weight:700;color:#fff;letter-spacing:-1px}
.lw{display:none}
.lb{bottom:20px;width:44px;height:44px;background:rgba(255,255,255,.3)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff!important}
.lb svg{color:#fff;filter:drop-shadow(0 1px 3px #0004)}
.lb.l{left:14px}.lb.r{right:14px}
.lhint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:12px;color:#aaaab2}
#lbar i{display:none}
#pass{padding-top:0}
#pass .ptx{position:absolute;top:70px;left:0;right:0;font-size:15px;font-weight:500}
#dots{position:absolute;top:104px;left:0;right:0;margin:0;gap:20px}#dots i{width:12px;height:12px;border-width:1.5px}
#pass .pad{position:absolute;top:150px;left:0;right:0;grid-template-columns:repeat(3,56px);gap:10px 17px}
.pad button{height:56px;border:0;background:#3a3a3e;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.pad button b{font-size:27px;font-weight:300;line-height:1}.pad button small{font-size:8px;letter-spacing:2px;font-weight:600;line-height:1;margin-top:2px}
#hint{position:absolute;top:130px;left:0;right:0;margin:0}
.pbt{position:absolute;bottom:16px;font-size:14px;color:#fff;cursor:pointer}.pl2{left:22px}.pr2{right:22px}
#wcal{background:linear-gradient(135deg,#ffffffb0,#d3dae8d0)!important;backdrop-filter:blur(16px);border:1.5px solid #fff;color:#1c1c1e!important}
.w.cal small{color:#d9534f;font-size:12px}.w.cal b{font-size:42px;font-weight:300}
.w.cal .pl{background:none;padding:0;margin-top:5px;display:flex;align-items:center;gap:6px;color:#1c1c1e}
.w.cal .pl i{width:3px;height:26px;border-radius:2px;margin:0;flex:none}
.w.cal .pl span{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.w.cal .pl strong{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.w.cal .pl em{font-style:normal;font-size:10px;color:#666}
.lnh{position:absolute;top:30px;left:0;right:0;height:44px;padding:0 12px 0 14px;display:flex;align-items:center;justify-content:space-between}
.lnh>b{font-size:21px;font-weight:800;color:#111}.tri{display:inline-block;border:4px solid transparent;border-top:5px solid #111;margin-left:3px;vertical-align:-1px}
.lnp{height:38px;padding:0 12px;border-radius:19px;background:#fff;box-shadow:0 2px 14px #0002;display:flex;gap:10px;align-items:center}
.dtw{position:relative;display:flex}.dtw em{position:absolute;top:-1px;right:-2px;width:6px;height:6px;border-radius:50%;background:#06c755}
.lns{position:absolute;top:80px;left:14px;right:14px;height:34px;border-radius:17px;background:#f4f4f5;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#b3b3b8;font-size:13px}
.lns>span:first-child{display:flex;align-items:center;gap:5px}
.scn{width:14px;height:14px;border:2px dashed #8e8e93;border-radius:3px}
.lnl{position:absolute;top:124px;bottom:70px;left:0;right:0;overflow-y:auto;overflow-x:hidden;background:#fff}
.lad{display:flex;justify-content:space-between;gap:12px;padding:6px 14px 14px;align-items:flex-start}
.lad>div{display:flex;flex-direction:column;gap:4px;min-width:0}.lad small{font-size:10px;color:#999}.lad b{font-size:12px;color:#222;line-height:1.35}
.lad i{flex:none;width:72px;height:72px;background:#eee}

window.PATCH={"callScripts":{"answerRate":1,"히이라기 쿠레토":{"answer":1,"lines":[{"who":"me","text":"누구냐."},{"text":"나다. 네가 등교 거부 중이라고 해서 말이지."},{"who":"me","text":"네가 괴롭히니까 그렇지. 그래서 무슨 일이야."},{"text":"오늘 학교에 나와라. 이건 명령이다."},{"who":"me","text":"무슨 일인데."},{"text":"오면 알려 주마. 아홉 시에 학생회실에서 보자."}],"again":[{"who":"me","text":"왜?"},{"text":"'무슨 일이십니까, 쿠레토 님'이라고 해야지."},{"who":"me","text":"부하한테 예속을 강요하는 타입이었나?"},{"text":"아니 뭐, 농담이지만."},{"text":"네 농담은 재미없어. 머리가 어떻게 되기라도 했나?"},{"who":"me","text":"하하하, 죽고 싶은거냐? 뭐, 내일 점심시간에 학생회실로 와라."},{"who":"me","text":"싫은데."},{"text":"하하, 네게 거부권은 없어. 그럼 내일 보—","cut":true}]},"아버지":{"lines":[{"text":"구렌이냐."},{"who":"me","text":"몸은 좀 어때요?"},{"text":"괜찮다."},{"who":"me","text":"(연한 회색 글씨체로) '심장이 멈출 정도의 고문을 받아 놓고 거짓말은'))"},{"text":"그보다 뉴스를 봐라."},{"text":"'햐쿠야 교'가 막아놨던 정보가 풀렸다."},{"who":"me","text":"동물들이 죽었다?"},{"text":"독극물이 살포되어 죽은 걸로 되어있다. 다른 가능성도 있으니 반경 500미터 범위를 봉쇄하겠다더구나."},{"text":"이 정보는 어제 새벽 2시에 이미 입수했었지만 '햐쿠야 교'가 정보를 규제했다. 실제로는 무슨 일이 일어났는지 모른다. 하지만 일대를 봉쇄한 것은 분명한 사실이야. "},{"who":"me","text":"그렇군요. 그럼 알아보고 연락드리겠습니다."}]},"히이라기 신야":{"lines":[{"text":"누구야~?"},{"who":"me","text":"나다. 키메라의 파편은?"},{"text":"어라, 구렌이야? 드디어 깨어났구나. 죽은 줄 알았어. 미토는 울기까지 했고."},{"who":"me","text":"네가 가져간 거냐? 아니면 히이라기에게 뺏긴 거냐?"},{"text":"숨겨 놨어."},{"who":"me","text":"내놔."},{"text":"아무리 나라고 해도 아이치까지 안 들키게 옮길 자신은 없는데."},{"text":"게다가 '햐쿠야 교'가 접촉해왔어. 마히루가 배신했으니 정보를 내놓으라나 뭐라나."},{"text":"나랑 같이 히이라기를 내부에서 박살—","cut":true}],"again":[{"text":"구렌, 나 좋아해? 왜 자꾸 전화를 건담~"},{"who":"me","text":"뭔 헛소리야. 어디야."},{"text":"이미 도착 완료!"},{"text":"다른 애들도 도착했어. 구렌만 오면 돼."},{"who":"me","text":"알았어."}]},"주조 미토":{"lines":[{"who":"me","text":"사유리냐?"},{"text":"구렌...살아 있었군요!"},{"who":"me","text":"미토냐. 어디 있지?"},{"text":"학교 시청각실에서 다른 학생들과 함께 있어요.. 오면 죽을 거예요"},{"who":"me","text":"그럼 왜 전화한거지? 구해 줬으면 하는거잖아?"},{"text":"아,아니에요! 그런게 아니라... 당신에게 고맙다는 인사를 하려고..."},{"who":"me","text":"어떤 상황인지 말해, 넌 지금ㅡ"},{"text":"아마.. 나는 오늘 죽을거예요. 당신이 좋아요. 구렌. 아마 당신이 나의 첫사랑..."},{"who":"me","text":"아마는 무슨 놈의 아마야! 그런건 살아서 제정신일 때 확인해! 죽으면 사랑이고 나발이고 없어!"},{"text":"흑.. 오지 마요. 오면 구렌도... 구렌... 도와...ㅡ","cut":true}]},"+1 (050) 142-1762":{"lines":[{"text":""},{"who":"me","text":"누구세요?"},{"text":"...이치노세 구렌군? 맞지?"},{"who":"me","text":".....누구냐. "},{"text":"그렇게 경계할 필요 없어. 나는 그저 너에게 흥미가 있는 사람일 뿐."},{"who":"me","text":"...."},{"text":"혹시 '햐쿠야 교'를 알고 있나? 정녕 지금이 네가 알고 있는 세상 전부라고 생각하나? "},{"who":"me","text":"무슨 말이 하고 싶은거지? "},{"text":"글쎄. 언젠가는 알게 되겠지. 그때까지 부디 조심해, 구렌 군, 네가 지키고자 하는 것들이 언제까지나 네 곁에 있으리란 보장은 없으니까."},{"text":"잠깐, 당신—","cut":true}]}},"messages":{"pinned":"","threads":[{"name":"맥도날드","preview":"[Web발신]\n(광고)[맥도날드] 겨울 한정 신메뉴 출시!","when":"11:00","unread":true,"sms":true},{"name":"나고야 경찰 히지모토","preview":"편하실 때 회신 주시면 감사드리겠습니다.","when":"금요일","unread":true,"sms":true},{"name":"세븐일레븐","preview":"[광고] 가을 한정 과자와 신상품 디저트 출시! 가까운 매장에서 만나보세요.","when":"어제","sms":true},{"name":"히이라기 쿠레토","preview":"신야네와 함께 오도록, 그리고 전화 받아라.","when":"화요일","sms":true},{"name":"매일카드","preview":"[Web발신]\n(광고)[매일카드] 이치노세 구렌님, 12월 한정 해외결제 캐시백 행사","when":"금요일","sms":true},{"name":"츠타야","preview":"[Web발신]\n(광고)[츠타야] 신작 영화 DVD 및 음악 CD 입고!","when":"2012. 10. 17.","sms":true},{"name":"택배 알림","preview":"[Web발신]\n고객님의 상품이 배송 완료되었습니다. (문 앞)","when":"목요일","sms":true},{"name":"히이라기 신야","preview":"어쨌든 빨리 와!","when":"어제","sms":true},{"name":"피자헛","preview":"[Web발신]\n(광고)기간 한정 피자 할인 행사! 가족과 친구들이 함께 즐기는 특별 메뉴를 만나보세요.(~12/31)","when":"2012. 12. 10.","sms":true},{"name":"미카도노츠키 주술 연구소","preview":"관련 자료들은 먼저 PDF파일로 보내드리겠습니다. 메일 확인 부탁드립니다.","when":"월요일","sms":true},{"name":"080-0024-1486","preview":"시노아는 두고 가도 돼.","when":"어제","sms":true}],"chats":{"히이라기 쿠레토":[{"date":"화요일 오후 6:02"},{"text":"내일 등교하면 학생회실로."},{"text":"신야네와 함께 오도록, 그리고 전화 받아라."},{"date":"오전 1:12"}],"080-0024-1486":[{"date":"2012년 08월 23일 일요일"},{"text":"받아"},{"text":"다음 번에 전화벨이 울리자마자 받지 않으면 네가 소중히 여기는 사람들을 몰살시킬 거야.","time":"21:05"},{"date":"어제 오후 9:47"},{"text":"구렌."},{"text":"시노아는 두고 가도 돼."},{"date":"어제 오후 9:47"}]}},"Line":{"ad":{"label":"광고","title":"2012년 크리스마스 한정 케이크 사전예약","sub":"스위트디저트 · 예약
